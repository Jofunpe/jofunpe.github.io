<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Calendario · Jofunpe</title>
<link rel="icon" type="image/png" href="./faviconn.png" />
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@400;500;600;700&family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#0a0c13; --bg-grid: radial-gradient(circle at 10% 0%, rgba(255,176,32,0.10), transparent 42%), radial-gradient(circle at 92% 100%, rgba(53,201,255,0.09), transparent 45%);
    --surface:#12141f; --surface-2:#171a27; --surface-3:#1d2131;
    --text:#eef0f7; --muted:#8b90a8; --muted-2:#5f6478;
    --border:#232739; --border-soft:#1a1d2b;
    --accent:#ffb020; --accent-ink:#1a1200; --accent-soft:rgba(255,176,32,0.14);
    --live:#ff4d5e; --live-soft:rgba(255,77,94,0.15);
    --on:#35c9ff; --on-soft:rgba(53,201,255,0.14);
    --evento:#22c55e; --evento-soft:rgba(34,197,94,0.14);
    --video:#a78bfa; --video-soft:rgba(167,139,250,0.16);
    --radius-lg:18px; --radius-md:12px; --radius-sm:9px;
    --font-display:'Oswald', sans-serif; --font-body:'Inter', sans-serif; --font-mono:'JetBrains Mono', monospace;
    --tooltip-bg: rgba(8,9,14,0.97); --tooltip-text:#f4f5fa;
  }

  *{ box-sizing:border-box; }
  html{ scroll-behavior:smooth; }

  body{
    margin:0; min-height:100vh; font-family:var(--font-body);
    background:
      var(--bg-grid),
      repeating-linear-gradient(0deg, rgba(255,255,255,0.012) 0px, rgba(255,255,255,0.012) 1px, transparent 1px, transparent 42px),
      var(--bg);
    color:var(--text);
    transition:background-color 220ms ease, color 220ms ease;
  }

  a{ color:inherit; }
  ::selection{ background:var(--accent); color:var(--accent-ink); }

  .shell{
    max-width:1360px; margin:0 auto; padding:32px 24px 60px;
    display:grid; grid-template-columns:320px 1fr; gap:26px; align-items:start;
  }

  /* ---------- Sidebar ---------- */
  .sidebar{ position:sticky; top:24px; display:flex; flex-direction:column; gap:16px; }

  .brand-block{ padding:2px 4px 6px; }
  .brand-eyebrow{
    font-family:var(--font-mono); font-size:11px; letter-spacing:.16em; color:var(--accent);
    display:flex; align-items:center; gap:8px; text-transform:uppercase; margin-bottom:10px;
  }
  .brand-eyebrow .dot{
    width:7px; height:7px; border-radius:50%; background:var(--live);
    animation:pulse 2.2s infinite;
  }
  @keyframes pulse{
    0%{ box-shadow:0 0 0 0 rgba(255,77,94,0.55); }
    70%{ box-shadow:0 0 0 9px rgba(255,77,94,0); }
    100%{ box-shadow:0 0 0 0 rgba(255,77,94,0); }
  }
  .brand-title{
    font-family:var(--font-display); font-size:32px; font-weight:600; letter-spacing:.01em;
    text-decoration:none; display:inline-block; line-height:1.05;
  }
  .brand-title span{ color:var(--accent); }
  .brand-sub{ color:var(--muted); font-size:13px; margin:8px 0 12px; line-height:1.5; }
  .brand-link{
    display:inline-flex; align-items:center; gap:8px; font-size:11.5px; font-weight:700;
    letter-spacing:.06em; text-transform:uppercase; color:var(--on); text-decoration:none;
    border-bottom:1px solid transparent; transition:border-color 160ms ease, transform 160ms ease, color 160ms ease;
  }
  .brand-link:hover{ border-color:var(--on); transform:translateX(2px); }

  .card{
    background:var(--surface); border:1px solid var(--border); border-radius:var(--radius-lg);
    padding:18px; box-shadow:0 20px 40px rgba(0,0,0,0.28);
  }

  /* mini calendar */
  .cal-head{ display:flex; align-items:center; justify-content:space-between; margin-bottom:2px; }
  .cal-month{ font-family:var(--font-display); font-size:19px; font-weight:600; letter-spacing:.02em; }
  .cal-nav{ display:flex; gap:6px; }
  .cal-nav button{
    width:26px; height:26px; border-radius:8px; border:1px solid var(--border); background:var(--surface-2);
    color:var(--muted); cursor:pointer; display:flex; align-items:center; justify-content:center; font-size:13px;
    transition:transform 150ms ease, border-color 150ms ease, color 150ms ease;
  }
  .cal-nav button:hover{ transform:scale(1.12); border-color:var(--accent); color:var(--accent); }
  .cal-sub{ font-size:11.5px; color:var(--muted-2); margin-bottom:14px; letter-spacing:.02em; }

  .cal-grid{ display:grid; grid-template-columns:repeat(7,1fr); gap:3px; margin-bottom:6px; }
  .cal-wd{ text-align:center; font-family:var(--font-mono); font-size:10.5px; color:var(--muted-2); padding-bottom:6px; letter-spacing:.04em; }
  .cal-day{
    position:relative; aspect-ratio:1/1; display:flex; align-items:center; justify-content:center;
    font-size:12.5px; color:var(--muted); border-radius:8px; cursor:default;
    transition:transform 150ms ease, background 150ms ease, color 150ms ease; z-index:1;
  }
  .cal-day.pad{ visibility:hidden; }
  .cal-day.has-event{ color:var(--text); cursor:pointer; font-weight:600; }
  .cal-day.has-event:hover{ transform:scale(1.18); background:var(--surface-3); z-index:3; }
  .cal-day.today{ outline:1.5px solid var(--accent); outline-offset:-1.5px; color:var(--accent); font-weight:700; }
  .cal-day .pip{
    position:absolute; bottom:3px; left:50%; transform:translateX(-50%); width:4px; height:4px; border-radius:50%;
    background:var(--accent);
  }
  .cal-day.multi .pip{ box-shadow:-4px 0 0 var(--evento), 4px 0 0 var(--video); width:3px; }

  .cal-divider{ height:1px; background:var(--border-soft); margin:14px 0; }

  .destacados-label{
    font-size:11px; letter-spacing:.1em; text-transform:uppercase; color:var(--muted); font-weight:700; margin-bottom:10px;
  }
  .destacado-item{
    display:flex; align-items:baseline; gap:10px; padding:8px 8px; border-radius:9px; cursor:pointer;
    transition:transform 150ms ease, background 150ms ease;
  }
  .destacado-item:hover{ background:var(--surface-2); transform:translateX(3px) scale(1.02); }
  .destacado-date{ font-family:var(--font-mono); font-size:10.5px; color:var(--muted-2); white-space:nowrap; min-width:44px; }
  .destacado-dot{ width:7px; height:7px; border-radius:50%; flex:none; }
  .destacado-name{ font-size:13px; color:var(--text); line-height:1.3; }
  .destacado-empty{ font-size:12.5px; color:var(--muted-2); padding:6px 8px; }

  /* controls card */
  .field{ display:flex; flex-direction:column; gap:7px; margin-bottom:14px; }
  .field:last-child{ margin-bottom:0; }
  .field-label{ font-size:11px; letter-spacing:.1em; text-transform:uppercase; color:var(--muted); font-weight:700; }

  .seg{ display:grid; grid-template-columns:repeat(5,1fr); gap:6px; }
  .seg button{
    font-family:var(--font-body); font-size:12px; font-weight:700; padding:9px 4px;
    border-radius:8px; border:1px solid var(--border); background:var(--surface-2); color:var(--muted);
    cursor:pointer; transition:transform 150ms ease, border-color 150ms ease, color 150ms ease, background 150ms ease;
  }
  .seg button:hover{ color:var(--text); border-color:var(--accent); transform:scale(1.08) translateY(-1px); z-index:2; position:relative; }
  .seg button.active{ background:var(--accent); color:var(--accent-ink); border-color:var(--accent); }

  select, input[type="search"]{
    width:100%; font-family:var(--font-body); font-size:13.5px; color:var(--text);
    background:var(--surface-2); border:1px solid var(--border); border-radius:var(--radius-sm);
    padding:9px 11px; outline:none; transition:border-color 150ms ease;
  }
  select:focus, input[type="search"]:focus{ border-color:var(--accent); }
  select[size]{ padding:4px; }
  select[size] option{ padding:7px 8px; border-radius:6px; }

  /* ---------- Main ---------- */
  .main{ display:flex; flex-direction:column; gap:22px; min-width:0; }

  /* live banner (ahora en directo / evento en curso) */
  .live-banner{ display:none; }
  .live-banner.show{ display:block; }
  .live-now-card{
    position:relative; overflow:hidden; border-radius:var(--radius-lg);
    padding:18px 22px; display:flex; align-items:center; gap:16px; cursor:pointer;
    transition:transform 180ms ease, box-shadow 180ms ease;
    border:1px solid var(--lnc-border, rgba(255,77,94,0.45));
    background:
      repeating-linear-gradient(115deg, rgba(255,255,255,0.035) 0 2px, transparent 2px 26px),
      linear-gradient(120deg, var(--lnc-soft, rgba(255,77,94,0.14)), var(--surface));
    animation:liveGlow 2.4s infinite;
  }
  /* Variantes de color según el tipo de evento en curso */
  .live-now-card.directo{ --lnc-color:var(--live); --lnc-border:rgba(255,77,94,0.45); --lnc-soft:rgba(255,77,94,0.14); --lnc-shadow:rgba(255,77,94,0.35); }
  .live-now-card.evento{ --lnc-color:var(--evento); --lnc-border:rgba(34,197,94,0.45); --lnc-soft:rgba(34,197,94,0.14); --lnc-shadow:rgba(34,197,94,0.35); }
  .live-now-card.video{ --lnc-color:var(--video); --lnc-border:rgba(167,139,250,0.45); --lnc-soft:rgba(167,139,250,0.14); --lnc-shadow:rgba(167,139,250,0.35); }
  .live-now-card:hover{ transform:translateY(-3px) scale(1.01); }
  @keyframes liveGlow{
    0%{ box-shadow:0 0 0 0 var(--lnc-shadow, rgba(255,77,94,0.35)); }
    70%{ box-shadow:0 0 0 10px rgba(0,0,0,0); }
    100%{ box-shadow:0 0 0 0 rgba(0,0,0,0); }
  }
  .live-now-tag{
    display:inline-flex; align-items:center; gap:8px; font-family:var(--font-mono); font-size:11.5px;
    letter-spacing:.16em; text-transform:uppercase; padding:7px 14px; border-radius:999px; flex:none;
    color:var(--lnc-color, var(--live)); background:var(--lnc-soft, var(--live-soft)); border:1px solid var(--lnc-border, rgba(255,77,94,0.4));
  }
  .live-now-tag .dot{ width:7px; height:7px; border-radius:50%; background:var(--lnc-color, var(--live)); animation:pulse 1.6s infinite; }
  .live-now-info{ min-width:0; }
  .live-now-info .lbl{ font-family:var(--font-mono); font-size:10.5px; letter-spacing:.08em; color:var(--muted); text-transform:uppercase; margin-bottom:3px; }
  .live-now-info h3{ margin:0; font-family:var(--font-display); font-weight:600; font-size:clamp(17px,2vw,21px); line-height:1.2; }

  .next-row{ display:grid; gap:16px; grid-template-columns:repeat(auto-fit,minmax(280px,1fr)); }

  .next-card{
    position:relative; overflow:hidden; border-radius:var(--radius-lg); border:1px solid var(--border);
    padding:22px 24px; min-height:150px; display:flex; flex-direction:column; justify-content:center; gap:9px;
    cursor:pointer; transition:transform 180ms ease, box-shadow 180ms ease;
    background:
      repeating-linear-gradient(115deg, rgba(255,255,255,0.035) 0 2px, transparent 2px 26px),
      linear-gradient(120deg, var(--surface-3), var(--surface));
  }
  .next-card:hover{ transform:translateY(-4px) scale(1.015); box-shadow:0 22px 44px rgba(0,0,0,0.4); }
  .next-card[data-kind="directo"]::after{ content:''; position:absolute; inset:0; pointer-events:none; background:radial-gradient(420px 180px at 90% 0%, var(--live-soft), transparent 70%); }
  .next-card[data-kind="evento"]::after{ content:''; position:absolute; inset:0; pointer-events:none; background:radial-gradient(420px 180px at 90% 0%, var(--evento-soft), transparent 70%); }
  .next-card[data-kind="video"]::after{ content:''; position:absolute; inset:0; pointer-events:none; background:radial-gradient(420px 180px at 90% 0%, var(--video-soft), transparent 70%); }

  .kind-tag{
    display:inline-flex; width:fit-content; align-items:center; gap:7px; font-family:var(--font-mono);
    font-size:10.5px; letter-spacing:.16em; text-transform:uppercase; padding:5px 11px; border-radius:999px;
    position:relative; border:1px solid;
  }
  .kind-tag .dot{ width:6px; height:6px; border-radius:50%; }
  .kind-tag.directo{ color:var(--live); background:var(--live-soft); border-color:rgba(255,77,94,0.35); }
  .kind-tag.directo .dot{ background:var(--live); animation:pulse 1.8s infinite; }
  .kind-tag.evento{ color:var(--evento); background:var(--evento-soft); border-color:rgba(34,197,94,0.35); }
  .kind-tag.evento .dot{ background:var(--evento); }
  .kind-tag.video{ color:var(--video); background:var(--video-soft); border-color:rgba(167,139,250,0.35); }
  .kind-tag.video .dot{ background:var(--video); }

  .next-card h3{ font-family:var(--font-display); font-weight:600; font-size:clamp(18px,2.1vw,23px); margin:2px 0 0; line-height:1.15; position:relative; }
  .next-card .next-date{ font-family:var(--font-mono); font-size:11.5px; color:var(--muted); letter-spacing:.05em; position:relative; text-transform:uppercase; }
  .next-card .cd{ display:flex; gap:6px; margin-top:6px; position:relative; }
  .next-card .cd b{ font-family:var(--font-mono); font-size:12px; color:var(--text); background:var(--surface-2); border:1px solid var(--border-soft); padding:2px 7px; border-radius:6px; }

  .feed-head{ display:flex; align-items:baseline; justify-content:space-between; gap:12px; padding:0 2px; }
  .feed-title{ font-family:var(--font-display); font-size:18px; font-weight:600; letter-spacing:.01em; }
  .feed-reset{
    font-family:var(--font-mono); font-size:11px; color:var(--muted); background:none; border:none; cursor:pointer;
    text-decoration:underline; text-underline-offset:3px; display:none;
  }
  .feed-reset.show{ display:inline; }

  .feed{ display:flex; flex-direction:column; gap:10px; }

  .feed-card{
    display:flex; align-items:center; gap:14px; background:var(--surface); border:1px solid var(--border);
    border-radius:var(--radius-md); padding:13px 16px; cursor:pointer; position:relative; overflow:hidden;
    transition:transform 160ms ease, box-shadow 160ms ease, border-color 160ms ease;
  }
  .feed-card:hover{ transform:translateY(-2px) scale(1.008); box-shadow:0 14px 28px rgba(0,0,0,0.3); border-color:var(--border); }
  .feed-card::before{ content:''; position:absolute; left:0; top:0; bottom:0; width:4px; }
  .feed-card[data-kind="directo"]::before{ background:var(--live); }
  .feed-card[data-kind="evento"]::before{ background:var(--evento); }
  .feed-card[data-kind="video"]::before{ background:var(--video); }

  .feed-date{
    font-family:var(--font-mono); font-size:11px; color:var(--muted); text-align:center; flex:none; width:52px;
    display:flex; flex-direction:column; gap:1px;
  }
  .feed-date b{ font-size:18px; color:var(--text); font-weight:700; }
  .feed-body{ flex:1; min-width:0; }
  .feed-body .fname{ font-size:14px; font-weight:700; margin-bottom:2px; }
  .feed-body .ftime{ font-size:12px; color:var(--muted); font-family:var(--font-mono); }
  .feed-tag{
    font-family:var(--font-mono); font-size:9.5px; letter-spacing:.1em; padding:3px 8px; border-radius:999px;
    text-transform:uppercase; flex:none;
  }
  .feed-tag.directo{ color:var(--live); background:var(--live-soft); }
  .feed-tag.evento{ color:var(--evento); background:var(--evento-soft); }
  .feed-tag.video{ color:var(--video); background:var(--video-soft); }

  .feed-empty{ font-size:13px; color:var(--muted-2); padding:20px; text-align:center; border:1px dashed var(--border); border-radius:var(--radius-md); }

  .legend{ font-size:11.5px; color:var(--muted-2); line-height:1.6; margin-top:2px; }
  .legend b{ color:var(--on); }

  /* ---------- Modal ---------- */
  .modal-backdrop{
    position:fixed; inset:0; background:rgba(4,5,9,0.6); backdrop-filter:blur(3px);
    display:flex; align-items:center; justify-content:center; padding:20px; z-index:50;
    opacity:0; visibility:hidden; pointer-events:none; transition:opacity 160ms ease, visibility 160ms ease;
  }
  .modal-backdrop.active{ opacity:1; visibility:visible; pointer-events:auto; }
  .modal{
    background:var(--surface); color:var(--text); border-radius:var(--radius-lg); padding:24px;
    max-width:420px; width:100%; box-shadow:0 30px 60px rgba(0,0,0,0.5); border:1px solid var(--border);
    transform:scale(0.94); opacity:0; transform-origin:center;
  }
  .modal-backdrop.active .modal{ opacity:1; transform:scale(1); }
  .modal.is-opening{ animation:modalZoomIn 170ms ease forwards; }
  .modal.is-closing{ animation:modalZoomOut 150ms ease forwards; }
  .modal-eyebrow{ font-family:var(--font-mono); font-size:11px; letter-spacing:.12em; text-transform:uppercase; margin-bottom:8px; }
  .modal h3{ margin:0 0 6px; font-family:var(--font-display); font-size:22px; font-weight:600; }
  .modal .modal-date{ font-family:var(--font-mono); font-size:12px; color:var(--muted); margin-bottom:12px; }
  .modal p{ margin:0; color:var(--muted); line-height:1.6; font-size:14px; }

  /* Barra de progreso: SOLO se muestra en el pop-up de "ahora en directo / en curso" */
  .modal-progress{ margin-top:16px; }
  .modal-progress-track{
    position:relative; width:100%; height:8px; border-radius:999px; background:var(--surface-2);
    border:1px solid var(--border-soft); overflow:hidden;
  }
  .modal-progress-fill{
    position:absolute; inset:0 auto 0 0; height:100%; width:0%; border-radius:999px;
    background:var(--live); transition:width 500ms ease;
  }
  .modal-progress-labels{
    display:flex; justify-content:space-between; gap:10px; margin-top:7px;
    font-family:var(--font-mono); font-size:10.5px; color:var(--muted); letter-spacing:.02em;
  }

  .modal-actions{ display:flex; justify-content:flex-end; gap:10px; margin-top:20px; flex-wrap:wrap; }
  .btn{ border:none; border-radius:999px; padding:10px 16px; font-size:13px; font-weight:600; cursor:pointer; transition:transform 140ms ease; }
  .btn:hover{ transform:translateY(-1px) scale(1.03); }
  .btn.primary{ background:var(--accent); color:var(--accent-ink); }
  .btn.secondary{ background:var(--surface-2); color:var(--text); border:1px solid var(--border); }

  @keyframes modalZoomIn{ 0%{ opacity:0; transform:scale(0.94);} 100%{ opacity:1; transform:scale(1);} }
  @keyframes modalZoomOut{ 0%{ opacity:1; transform:scale(1);} 100%{ opacity:0; transform:scale(0.92);} }

  @media (max-width:980px){
    .shell{ grid-template-columns:1fr; }
    .sidebar{ position:static; }
  }
  @media (max-width:520px){
    .shell{ padding:20px 14px 40px; }
  }

  @media (prefers-reduced-motion:reduce){
    *{ animation-duration:0.01ms !important; animation-iteration-count:1 !important; transition-duration:0.01ms !important; }
  }
</style>
</head>
<body>
  <div class="shell">
    <!-- SIDEBAR -->
    <aside class="sidebar">
      <div class="brand-block">
        <div class="brand-eyebrow"><span class="dot"></span>Calendario del canal</div>
        <a class="brand-title" href="https://youtube.com/@jofun2" target="_blank" rel="noopener noreferrer">Jofunpe</a>
        <p class="brand-sub">Directos, eventos y vídeos programados, ajustados a tu zona horaria.</p>
        <a class="brand-link" href="https://jofunpe.com" target="_blank" rel="noopener noreferrer">Todas las redes de Jofunpe →</a>
      </div>

      <div class="card">
        <div class="cal-head">
          <div class="cal-month" id="calMonth">—</div>
          <div class="cal-nav">
            <button id="prevMonth" aria-label="Mes anterior">‹</button>
            <button id="nextMonth" aria-label="Mes siguiente">›</button>
          </div>
        </div>
        <div class="cal-sub">Calendario mensual</div>
        <div class="cal-grid" id="calGrid"></div>

        <div class="cal-divider"></div>

        <div class="destacados-label">Eventos destacados</div>
        <div id="destacadosList"></div>
      </div>

      <div class="card">
        <div class="field">
          <div class="field-label">Tema visual</div>
          <div class="seg" id="themeSeg">
            <button data-theme="oscuro" class="active">Oscuro</button>
            <button data-theme="claro">Claro</button>
            <button data-theme="verde">Verde</button>
            <button data-theme="rojo">Rojo</button>
            <button data-theme="morado">Morado</button>
          </div>
        </div>
        <div class="field">
          <div class="field-label">Tu zona horaria</div>
          <input id="timezoneSearch" type="search" placeholder="Buscar país o zona…" aria-label="Buscar zona horaria" />
          <select id="timezoneSelector" aria-label="Selector de zona horaria" size="6"></select>
        </div>
        <div class="legend">Los eventos se recalculan al vuelo según la zona seleccionada.</div>
      </div>
    </aside>

    <!-- MAIN -->
    <main class="main">
      <div class="live-banner" id="liveBanner"></div>

      <div class="next-row" id="nextRow"></div>

      <div>
        <div class="feed-head">
          <div class="feed-title">Próximamente</div>
          <button class="feed-reset" id="feedReset">Ver todos ✕</button>
        </div>
      </div>
      <div class="feed" id="feed"></div>
    </main>
  </div>

  <div class="modal-backdrop" id="modalBackdrop" role="dialog" aria-modal="true">
    <div class="modal">
      <div class="modal-eyebrow" id="modalEyebrow">Detalle</div>
      <h3 id="modalTitle"></h3>
      <div class="modal-date" id="modalDate"></div>
      <p id="modalContent"></p>
      <div class="modal-progress" id="modalProgress" style="display:none;">

  <script>
    /* ===================== Datos de eventos ===================== */
    /* type: 'directo' | 'evento' | 'video'
       repeat: número de veces que se repite el evento (1, 2, 3...) contando desde "startDate",
               o la cadena 'infinite' para que se repita cada semana sin fin (comportamiento por defecto
               si no se indica "repeat").
       startDate: 'YYYY-MM-DD' → fecha de la PRIMERA aparición de este evento. Es obligatoria si
               "repeat" es un número, porque a partir de ahí se cuentan las repeticiones semana a semana.
               Si "repeat" es 'infinite' (o no se indica), startDate es opcional.
       endTime: 'HH:MM' (OPCIONAL) → hora a la que termina el directo/evento, en la misma zona horaria
               indicada en "timeZone". Si no se indica, se usa la duración por defecto
               (EVENT_DURATION_MIN, 120 minutos) para saber cuándo se considera terminado.
       endOffsetDays: número (OPCIONAL) → cuántos días DESPUÉS del día de inicio termina el evento.
               - Si no se indica (o es 0): el evento termina el MISMO día, a la hora de "endTime".
               - Si se indica 1: termina al día SIGUIENTE, a la hora de "endTime".
               - Si se indica 2, 3, 5...: termina esos días después, a la hora de "endTime".
               Así puedes indicar exactamente qué día y a qué hora termina un evento que dura
               varios días (por ejemplo, un torneo o un evento especial de varios días). */
    const events = [

        repeat: 3,               // ocurre 3 semanas seguidas desde el 2026-08-01 y luego desaparece
        endTime: '20:00',        // hora a la que termina (misma timeZone)
        endOffsetDays: 2         // termina 2 días después de empezar (ej: empieza sábado, acaba el lunes a las 20:00)
      }
      */
    ];

    const TYPE_LABEL = { directo: 'Directo', evento: 'Evento', video: 'Vídeo' };
    const TYPE_ORDER = ['directo', 'evento', 'video'];
    // Textos que se muestran en la etiqueta del banner de "en curso", según el tipo de evento.
    const LIVE_LABELS = { directo: 'Ahora en directo', evento: 'Evento en curso', video: 'Vídeo en curso' };
    const EVENT_DURATION_MIN = 120;
    const WEEKDAYS = ['lunes','martes','miércoles','jueves','viernes','sábado','domingo'];
    const WD_MAP = { Mon:0, Tue:1, Wed:2, Thu:3, Fri:4, Sat:5, Sun:6 };
    const MESES = ['enero','febrero','marzo','abril','mayo','junio','julio','agosto','septiembre','octubre','noviembre','diciembre'];
    const MESES_ABR = ['ENE','FEB','MAR','ABR','MAY','JUN','JUL','AGO','SEP','OCT','NOV','DIC'];

    /* ===================== Utilidades de fecha/zona ===================== */
    function pad(n){ return String(n).padStart(2,'0'); }

    function mondayOf(date){
      const d = new Date(date.getFullYear(), date.getMonth(), date.getDate());
      const diff = (d.getDay() + 6) % 7;
      d.setDate(d.getDate() - diff);
      return d;
    }

    function localWallToUtc(y, m, d, hour, minute, tz){
      const guessUtc = Date.UTC(y, m, d, hour, minute, 0);
      const fmt = new Intl.DateTimeFormat('en-US', {
        timeZone: tz, year:'numeric', month:'2-digit', day:'2-digit',
        hour:'2-digit', minute:'2-digit', second:'2-digit', hour12:false
      });
      const parts = fmt.formatToParts(new Date(guessUtc)).reduce((acc,{type,value}) => { acc[type]=value; return acc; }, {});
      const asUtcIfLocalWereTz = Date.UTC(
        Number(parts.year), Number(parts.month) - 1, Number(parts.day),
        Number(parts.hour) % 24, Number(parts.minute), Number(parts.second)
      );
      const offset = asUtcIfLocalWereTz - guessUtc;
      return guessUtc - offset;
    }

    function eventUtcMsForWeek(event, monday){
      const dayIndex = WEEKDAYS.indexOf(event.day.toLowerCase());
      const [hour, minute] = event.time.split(':').map(Number);
      const target = new Date(monday.getFullYear(), monday.getMonth(), monday.getDate() + dayIndex);
      return localWallToUtc(target.getFullYear(), target.getMonth(), target.getDate(), hour, minute, event.timeZone || 'UTC');
    }

    /* Calcula el instante (ms UTC) en el que termina un evento que ha empezado en "startMs".
       - Si el evento NO tiene "endTime": termina a los EVENT_DURATION_MIN minutos por defecto.
       - Si el evento tiene "endTime" pero NO tiene "endOffsetDays": termina el MISMO día del
         inicio, a esa hora (aunque sea una hora "menor" que la de inicio).
       - Si el evento tiene "endTime" Y "endOffsetDays": termina "endOffsetDays" días después
         del día de inicio, a la hora indicada en "endTime". Así se pueden representar eventos
         que duran varios días con total precisión. */
    function getEventEndMs(event, startMs){
      const tz = event.timeZone || 'UTC';
      if (event.endTime){
        const fmt = new Intl.DateTimeFormat('en-US', { timeZone: tz, year:'numeric', month:'2-digit', day:'2-digit' });
        const parts = fmt.formatToParts(new Date(startMs)).reduce((acc,{type,value}) => { acc[type]=value; return acc; }, {});
        const [eh, em] = event.endTime.split(':').map(Number);
        const rawOffset = Number(event.endOffsetDays);
        const offsetDays = Number.isFinite(rawOffset) && rawOffset > 0 ? rawOffset : 0;
        const baseDate = new Date(Number(parts.year), Number(parts.month) - 1, Number(parts.day));
        baseDate.setDate(baseDate.getDate() + offsetDays);
        return localWallToUtc(baseDate.getFullYear(), baseDate.getMonth(), baseDate.getDate(), eh, em, tz);
      }
      return startMs + EVENT_DURATION_MIN * 60000;
    }

    /* ---------- Repeticiones: número de ocurrencias limitado o infinito ---------- */
    // Devuelve el lunes (00:00 local) de la semana en la que cae event.startDate, o null si no hay startDate.
    function startMondayOf(event){
      if (!event.startDate) return null;
      const [sy, sm, sd] = event.startDate.split('-').map(Number);
      return mondayOf(new Date(sy, sm - 1, sd));
    }

    // Devuelve el número de orden (1 = primera vez, 2 = segunda...) de la ocurrencia que cae en la semana
    // cuyo lunes es "weekMonday". Si el evento no tiene startDate, devuelve null (no se puede contar).
    function occurrenceOrdinal(event, weekMonday){
      const startMonday = startMondayOf(event);
      if (!startMonday) return null;
      const diffWeeks = Math.round((weekMonday.getTime() - startMonday.getTime()) / (7 * 86400000));
      return diffWeeks + 1;
    }

    // ¿Debe aparecer este evento en la semana cuyo lunes es "weekMonday"?
    function isEventActiveInWeek(event, weekMonday){
      const repeat = event.repeat;
      if (repeat === undefined || repeat === null || repeat === 'infinite') return true;
      const n = Number(repeat);
      if (!Number.isFinite(n) || n < 1) return true; // valor no reconocido -> se trata como infinito
      const ordinal = occurrenceOrdinal(event, weekMonday);
      if (ordinal === null) return true; // sin startDate no se puede acotar, se muestra siempre
      return ordinal >= 1 && ordinal <= n;
    }

    function eventType(event){ return TYPE_LABEL[event.type] ? event.type : 'directo'; }

    function nextOccurrence(event, fromMs = Date.now()){
      const monday = mondayOf(new Date(fromMs));
      for (let i = 0; i < 300; i++){
        const wk = new Date(monday.getFullYear(), monday.getMonth(), monday.getDate() + 7 * i);
        if (!isEventActiveInWeek(event, wk)) {
          // Si ya hemos agotado las repeticiones (y no es infinito), no hace falta seguir buscando más lejos.
          const repeat = event.repeat;
          if (repeat !== undefined && repeat !== null && repeat !== 'infinite') {
            const n = Number(repeat);
            const ordinal = occurrenceOrdinal(event, wk);
            if (Number.isFinite(n) && ordinal !== null && ordinal > n) return null;
          }
          continue;
        }
        const ms = eventUtcMsForWeek(event, wk);
        if (ms >= fromMs) return ms;
      }
      return null;
    }

    function nextOccurrenceByType(type, fromMs = Date.now()){
      let best = null;
      events.filter((e) => eventType(e) === type).forEach((event) => {
        const ms = nextOccurrence(event, fromMs);
        if (ms !== null && (!best || ms < best.ms)) best = { event, ms };
      });
      return best;
    }

    function generateUpcoming(weeksAhead = 10, fromMs = Date.now()){
      const monday = mondayOf(new Date(fromMs));
      const results = [];
      events.forEach((event) => {
        for (let i = 0; i < weeksAhead; i++){
          const wk = new Date(monday.getFullYear(), monday.getMonth(), monday.getDate() + 7 * i);
          if (!isEventActiveInWeek(event, wk)) continue;
          const ms = eventUtcMsForWeek(event, wk);
          if (ms >= fromMs) results.push({ event, ms });
        }
      });
      return results.sort((a, b) => a.ms - b.ms);
    }

    // Igual que generateUpcoming, pero solo con la próxima ocurrencia de cada evento DISTINTO,
    // hasta un máximo de "maxCount" eventos diferentes.
    function generateUpcomingUnique(maxCount, fromMs = Date.now()){
      const upcoming = generateUpcoming(10, fromMs);
      const seen = new Set();
      const result = [];
      for (const item of upcoming){
        if (seen.has(item.event)) continue;
        seen.add(item.event);
        result.push(item);
        if (result.length >= maxCount) break;
      }
      return result;
    }

    function monthOccurrences(year, month, tz){
      const monthStart = localWallToUtc(year, month, 1, 0, 0, tz);
      const nextM = month === 11 ? 0 : month + 1;
      const nextY = month === 11 ? year + 1 : year;
      const monthEnd = localWallToUtc(nextY, nextM, 1, 0, 0, tz);
      const results = [];
      const scanStart = mondayOf(new Date(year, month, 1));
      scanStart.setDate(scanStart.getDate() - 7);
      events.forEach((event) => {
        let wk = new Date(scanStart);
        for (let i = 0; i < 8; i++){
          if (isEventActiveInWeek(event, wk)) {
            const ms = eventUtcMsForWeek(event, wk);
            if (ms >= monthStart && ms < monthEnd) results.push({ event, ms });
          }
          wk = new Date(wk.getFullYear(), wk.getMonth(), wk.getDate() + 7);
        }
      });
      return results.sort((a, b) => a.ms - b.ms);
    }

    /* Busca si hay algún evento en curso justo ahora (fromMs). Comprueba la ocurrencia de esta
       semana y la de la semana anterior para cada evento (por si empezó antes de medianoche del
       lunes o dura más de lo habitual) y devuelve el primero cuyo rango [inicio, fin) contenga
       "fromMs". Si no hay ninguno en directo ahora mismo, devuelve null. */
    function getCurrentlyLiveEvent(fromMs = Date.now()){
      const monday = mondayOf(new Date(fromMs));
      const prevMonday = new Date(monday.getFullYear(), monday.getMonth(), monday.getDate() - 7);
      let found = null;
      events.forEach((event) => {
        [prevMonday, monday].forEach((wk) => {
          if (!isEventActiveInWeek(event, wk)) return;
          const startMs = eventUtcMsForWeek(event, wk);
          const endMs = getEventEndMs(event, startMs);
          if (fromMs >= startMs && fromMs < endMs) {
            found = { event, startMs, endMs };
          }
        });
      });
      return found;
    }

    /* ===================== Zonas horarias ===================== */
    const zoneData = Array.isArray(window.timeZoneEntries) ? window.timeZoneEntries : [];
    const regionNames = typeof Intl.DisplayNames === 'function' ? new Intl.DisplayNames(['es'], { type: 'region' }) : null;

    function getCountryName(code){ return (regionNames && regionNames.of(code)) || code; }
    function formatZoneVariant(zone){
      const parts = zone.split('/').slice(1).filter(Boolean);
      return parts.join(' / ').replace(/_/g, ' ') || zone;
    }
    function buildGroupedTimezones(){
      const grouped = new Map();
      zoneData.forEach(({ countryCode, zone }) => {
        if (!countryCode || !zone) return;
        countryCode.split(',').forEach((code) => {
          const trimmed = code.trim();
          if (!trimmed) return;
          if (!grouped.has(trimmed)) grouped.set(trimmed, new Set());
          grouped.get(trimmed).add(zone);
        });
      });
      return Array.from(grouped.entries())
        .map(([code, zones]) => ({ code, name: getCountryName(code), zones: Array.from(zones) }))
        .sort((a, b) => a.name.localeCompare(b.name, 'es'));
    }
    const groupedTimezones = buildGroupedTimezones();

    function normalizeText(value){
      return value.toLowerCase().normalize('NFD').replace(/\p{Diacritic}/gu, '').replace(/[^\p{Letter}\p{Number}\s()./-]/gu, '');
    }

    function rebuildTimezoneOptions(selectedValue, searchTerm = ''){
      const rawTerm = searchTerm.trim();
      const lowerTerm = rawTerm.toLowerCase();
      const normalizedTerm = normalizeText(rawTerm);
      const options = [];
      const isSearching = lowerTerm.length > 0;

      groupedTimezones.forEach(({ name, zones }) => {
        if (zones.length === 1){
          const label = name;
          const labelLower = label.toLowerCase();
          const labelNormalized = normalizeText(label);
          if (!isSearching || labelLower.includes(lowerTerm) || labelNormalized.includes(normalizedTerm)){
            options.push({ value: zones[0], label });
          }
        } else {
          zones.forEach((zone) => {
            const variant = formatZoneVariant(zone);
            const label = `${name} (${variant})`;
            const labelLower = label.toLowerCase();
            const labelNormalized = normalizeText(label);
            if (!isSearching || labelLower.includes(lowerTerm) || labelNormalized.includes(normalizedTerm)){
              options.push({ value: zone, label });
            }
          });
        }
      });

      options.sort((a, b) => a.label.localeCompare(b.label, 'es'));
      timezoneSelector.innerHTML = '';
      options.forEach(({ value, label }) => {
        const opt = document.createElement('option');
        opt.value = value; opt.textContent = label;
        timezoneSelector.appendChild(opt);
      });

      if (selectedValue && options.some((opt) => opt.value === selectedValue)){
        timezoneSelector.value = selectedValue;
      } else if (options.length > 0){
        timezoneSelector.value = options[0].value;
      }
      return options;
    }

    /* ===================== Temas ===================== */
    const themes = {
      oscuro:  { '--bg':'#0a0c13', '--surface':'#12141f', '--surface-2':'#171a27', '--surface-3':'#1d2131', '--text':'#eef0f7', '--muted':'#8b90a8', '--muted-2':'#5f6478', '--border':'#232739', '--border-soft':'#1a1d2b', '--accent':'#ffb020', '--accent-ink':'#1a1200', '--on':'#35c9ff', '--evento':'#22c55e', '--video':'#a78bfa' },
      claro:   { '--bg':'#f3f4f8', '--surface':'#ffffff', '--surface-2':'#f3f4f9', '--surface-3':'#eceef6', '--text':'#171923', '--muted':'#6b7280', '--muted-2':'#9aa0b1', '--border':'#e2e4ee', '--border-soft':'#edeef5', '--accent':'#d97706', '--accent-ink':'#fffaf0', '--on':'#0284c7', '--evento':'#16a34a', '--video':'#7c3aed' },
      verde:   { '--bg':'#06120d', '--surface':'#0c1f16', '--surface-2':'#0f2a1d', '--surface-3':'#123424', '--text':'#d9f5e6', '--muted':'#7fa895', '--muted-2':'#4d7867', '--border':'#163a29', '--border-soft':'#122e21', '--accent':'#34d399', '--accent-ink':'#04150d', '--on':'#a3e635', '--evento':'#86efac', '--video':'#c084fc' },
      rojo:    { '--bg':'#170a0d', '--surface':'#241014', '--surface-2':'#2c151a', '--surface-3':'#341920', '--text':'#fbe3e6', '--muted':'#c98f95', '--muted-2':'#8f5f64', '--border':'#3a151b', '--border-soft':'#2c1116', '--accent':'#f87171', '--accent-ink':'#1a0508', '--on':'#fb923c', '--evento':'#22c55e', '--video':'#e879f9' },
      morado:  { '--bg':'#130a1f', '--surface':'#1e1032', '--surface-2':'#27143e', '--surface-3':'#301a4c', '--text':'#f1e8fc', '--muted':'#ab97cc', '--muted-2':'#7c669c', '--border':'#3b2159', '--border-soft':'#2c1846', '--accent':'#c084fc', '--accent-ink':'#1c0733', '--on':'#f472b6', '--evento':'#34d399', '--video':'#818cf8' }
    };

    function applyTheme(themeKey){
      const theme = themes[themeKey] || themes.oscuro;
      Object.entries(theme).forEach(([k, v]) => document.documentElement.style.setProperty(k, v));
      localStorage.setItem('jofun2-theme', themeKey);
      document.querySelectorAll('#themeSeg button').forEach((b) => b.classList.toggle('active', b.dataset.theme === themeKey));
    }

    /* ===================== Referencias DOM ===================== */
    const timezoneSelector = document.getElementById('timezoneSelector');
    const timezoneSearch = document.getElementById('timezoneSearch');
    const themeSeg = document.getElementById('themeSeg');
    const modalBackdrop = document.getElementById('modalBackdrop');
    const modal = modalBackdrop.querySelector('.modal');
    const modalEyebrow = document.getElementById('modalEyebrow');
    const modalTitle = document.getElementById('modalTitle');
    const modalDate = document.getElementById('modalDate');
    const modalContent = document.getElementById('modalContent');
    const modalProgress = document.getElementById('modalProgress');
    const modalProgressFill = document.getElementById('modalProgressFill');
    const modalProgressStart = document.getElementById('modalProgressStart');
    const modalProgressEnd = document.getElementById('modalProgressEnd');
    const modalLink = document.getElementById('modalLink');
    const closeModalBtn = document.getElementById('closeModal');
    const liveBanner = document.getElementById('liveBanner');
    const nextRow = document.getElementById('nextRow');
    const feedEl = document.getElementById('feed');
    const feedReset = document.getElementById('feedReset');
    const calMonth = document.getElementById('calMonth');
    const calGrid = document.getElementById('calGrid');
    const destacadosList = document.getElementById('destacadosList');

    let monthCursor = new Date();
    monthCursor.setDate(1);
    let dayFilter = null; // {year, month, day} or null
    let progressInterval = null; // intervalo que refresca la barra de progreso del modal "en curso"

    /* ===================== "Ahora en directo / en curso" ===================== */
    function renderLiveBanner(targetTimeZone){
      const live = getCurrentlyLiveEvent();
      liveBanner.innerHTML = '';
      if (!live){
        liveBanner.classList.remove('show');
        return;
      }
      liveBanner.classList.add('show');
      const type = eventType(live.event);
      const card = document.createElement('div');
      card.className = 'live-now-card ' + type;
      card.innerHTML = `
        <span class="live-now-tag"><span class="dot"></span>${LIVE_LABELS[type] || 'En curso'}</span>
        <div class="live-now-info">
          <div class="lbl">${TYPE_LABEL[type]} en curso</div>
          <h3>${live.event.name}</h3>
        </div>
      `;
      // Solo aquí pasamos la info de inicio/fin para que el modal muestre la barra de progreso.
      card.addEventListener('click', () => openModal(live.event, live.startMs, targetTimeZone, { startMs: live.startMs, endMs: live.endMs }));
      liveBanner.appendChild(card);
    }

    /* ===================== "Próximo X" ===================== */
    function renderNextRow(targetTimeZone){
      nextRow.innerHTML = '';
      TYPE_ORDER.forEach((type) => {
        const best = nextOccurrenceByType(type);
        if (!best) return;
        const { hour, minute, day, month } = fullPartsInTz(best.ms, targetTimeZone);
        const card = document.createElement('div');
        card.className = 'next-card';
        card.dataset.kind = type;
        const dayLabel = new Intl.DateTimeFormat('es-ES', { timeZone: targetTimeZone, weekday: 'long' }).format(new Date(best.ms));
        const niceDay = dayLabel.charAt(0).toUpperCase() + dayLabel.slice(1);
        card.innerHTML = `
          <span class="kind-tag ${type}"><span class="dot"></span>Próximo ${TYPE_LABEL[type].toLowerCase()}</span>
          <h3>${best.event.name}</h3>
          <span class="next-date">${niceDay} · ${day} ${MESES_ABR[month]} · ${pad(hour)}:${pad(minute)}</span>
        `;
        // Aquí NO se pasa info de progreso: este pop-up nunca debe mostrar la barra.
        card.addEventListener('click', () => openModal(best.event, best.ms, targetTimeZone));
        nextRow.appendChild(card);
      });
      if (!nextRow.children.length){
        nextRow.innerHTML = '<div class="feed-empty">No hay nada programado por ahora.</div>';
      }
    }

    /* ===================== Feed / próximamente ===================== */
    function renderFeed(targetTimeZone){
      let list;
      if (dayFilter){
        list = generateUpcoming(10).filter(({ ms }) => {
          const p = fullPartsInTz(ms, targetTimeZone);
          return p.year === dayFilter.year && p.month === dayFilter.month && p.day === dayFilter.day;
        });
        feedReset.classList.add('show');
      } else {
        list = generateUpcomingUnique(5);
        feedReset.classList.remove('show');
      }

      feedEl.innerHTML = '';
      if (!list.length){
        feedEl.innerHTML = '<div class="feed-empty">No hay eventos programados para este día.</div>';
        return;
      }

      list.forEach(({ event, ms }) => {
        const { hour, minute, day, month } = fullPartsInTz(ms, targetTimeZone);
        const type = eventType(event);
        const isLiveNow = Date.now() >= ms && Date.now() < getEventEndMs(event, ms);
        const card = document.createElement('div');
        card.className = 'feed-card';
        card.dataset.kind = type;
        card.innerHTML = `
          <div class="feed-date"><b>${day}</b><span>${MESES_ABR[month]}</span></div>
          <div class="feed-body">
            <div class="fname">${event.name}${isLiveNow ? ' · 🔴' : ''}</div>
            <div class="ftime">${pad(hour)}:${pad(minute)}</div>
          </div>
          <span class="feed-tag ${type}">${TYPE_LABEL[type]}</span>
        `;
        // Este pop-up tampoco debe mostrar la barra de progreso (solo el banner "en curso" la muestra).
        card.addEventListener('click', () => openModal(event, ms, targetTimeZone));
        feedEl.appendChild(card);
      });
    }

    feedReset.addEventListener('click', () => {
      dayFilter = null;
      renderFeed(timezoneSelector.value);
    });

    /* ===================== Mini calendario mensual ===================== */
    function renderMiniCalendar(targetTimeZone){
      const year = monthCursor.getFullYear();
      const month = monthCursor.getMonth();
      calMonth.textContent = `${MESES[month].toUpperCase()} ${year}`;

      const occurrences = monthOccurrences(year, month, targetTimeZone);
      const byDay = new Map();
      occurrences.forEach(({ event, ms }) => {
        const p = fullPartsInTz(ms, targetTimeZone);
        if (!byDay.has(p.day)) byDay.set(p.day, []);
        byDay.get(p.day).push({ event, ms });
      });

      calGrid.innerHTML = '';
      ['L','M','X','J','V','S','D'].forEach((wd) => {
        const el = document.createElement('div');
        el.className = 'cal-wd';
        el.textContent = wd;
        calGrid.appendChild(el);
      });

      const firstOfMonth = new Date(year, month, 1);
      const leadBlanks = (firstOfMonth.getDay() + 6) % 7;
      const daysInMonth = new Date(year, month + 1, 0).getDate();
      const todayParts = fullPartsInTz(Date.now(), targetTimeZone);

      for (let i = 0; i < leadBlanks; i++){
        const pad_ = document.createElement('div');
        pad_.className = 'cal-day pad';
        calGrid.appendChild(pad_);
      }

      for (let d = 1; d <= daysInMonth; d++){
        const cell = document.createElement('div');
        cell.className = 'cal-day';
        cell.textContent = d;
        const dayEvents = byDay.get(d);
        if (dayEvents && dayEvents.length){
          cell.classList.add('has-event');
          if (new Set(dayEvents.map((x) => eventType(x.event))).size > 1) cell.classList.add('multi');
          const pip = document.createElement('span');
          pip.className = 'pip';
          const kind = eventType(dayEvents[0].event);
          pip.style.background = kind === 'directo' ? 'var(--live)' : kind === 'evento' ? 'var(--evento)' : 'var(--video)';
          cell.appendChild(pip);
          cell.addEventListener('click', () => {
            if (dayEvents.length === 1){
              // Un solo evento ese día -> abrir directamente el modal con la info y el enlace.
              openModal(dayEvents[0].event, dayEvents[0].ms, targetTimeZone);
            } else {
              // Varios eventos ese día -> filtrar el feed de abajo para poder elegir cuál ver.
              dayFilter = { year, month, day: d };
              renderFeed(targetTimeZone);
            }
          });
        }
        if (todayParts.year === year && todayParts.month === month && todayParts.day === d){
          cell.classList.add('today');
        }
        calGrid.appendChild(cell);
      }
    }

    /* ===================== Eventos destacados ===================== */
    function renderDestacados(targetTimeZone){
      const year = monthCursor.getFullYear();
      const month = monthCursor.getMonth();
      const now = Date.now();
      const upcoming = monthOccurrences(year, month, targetTimeZone)
        .filter((x) => x.ms >= now && eventType(x.event) === 'evento')
        .slice(0, 6);

      destacadosList.innerHTML = '';
      if (!upcoming.length){
        destacadosList.innerHTML = '<div class="destacado-empty">Sin eventos pendientes este mes.</div>';
        return;
      }
      upcoming.forEach(({ event, ms }) => {
        const { day, month: m } = fullPartsInTz(ms, targetTimeZone);
        const type = eventType(event);
        const item = document.createElement('div');
        item.className = 'destacado-item';
        item.innerHTML = `
          <span class="destacado-date">${day} ${MESES_ABR[m]}</span>
          <span class="destacado-dot" style="background:${type === 'directo' ? 'var(--live)' : type === 'evento' ? 'var(--evento)' : 'var(--video)'}"></span>
          <span class="destacado-name">${event.name}</span>
        `;
        item.addEventListener('click', () => openModal(event, ms, targetTimeZone));
        destacadosList.appendChild(item);
      });
    }

    /* ===================== Barra de progreso del modal "en curso" ===================== */
    function progressLabel(ms, tz){
      const p = fullPartsInTz(ms, tz);
      const wd = new Intl.DateTimeFormat('es-ES', { timeZone: tz, weekday: 'short' }).format(new Date(ms)).replace('.', '');
      const niceWd = wd.charAt(0).toUpperCase() + wd.slice(1);
      return `${niceWd} ${p.day} ${MESES_ABR[p.month]} · ${pad(p.hour)}:${pad(p.minute)}`;
    }

    function updateModalProgress(event, liveInfo, targetTimeZone){
      const { startMs, endMs } = liveInfo;
      const total = endMs - startMs;
      const now = Date.now();
      const pct = total > 0 ? Math.min(100, Math.max(0, ((now - startMs) / total) * 100)) : 100;
      modalProgressFill.style.width = pct + '%';
      const type = eventType(event);
      modalProgressFill.style.background = type === 'directo' ? 'var(--live)' : type === 'evento' ? 'var(--evento)' : 'var(--video)';
      modalProgressStart.textContent = progressLabel(startMs, targetTimeZone);
      modalProgressEnd.textContent = progressLabel(endMs, targetTimeZone);
    }

    /* ===================== Modal ===================== */
    function openModal(event, ms, targetTimeZone, liveInfo){
      const type = eventType(event);
      modal.classList.remove('is-closing');
      modalEyebrow.textContent = TYPE_LABEL[type];
      modalEyebrow.style.color = type === 'directo' ? 'var(--live)' : type === 'evento' ? 'var(--evento)' : 'var(--video)';
      modalTitle.textContent = event.name;
      if (ms){
        const startParts = fullPartsInTz(ms, targetTimeZone);
        const dayLabel = new Intl.DateTimeFormat('es-ES', { timeZone: targetTimeZone, weekday: 'long' }).format(new Date(ms));
        const niceDayLabel = dayLabel.charAt(0).toUpperCase() + dayLabel.slice(1);
        let dateText = `${niceDayLabel} ${startParts.day} de ${MESES[startParts.month]} · ${pad(startParts.hour)}:${pad(startParts.minute)}`;
        const endMs = getEventEndMs(event, ms);
        if (endMs){
          const endParts = fullPartsInTz(endMs, targetTimeZone);
          const sameDay = endParts.year === startParts.year && endParts.month === startParts.month && endParts.day === startParts.day;
          if (sameDay){
            dateText += ` – ${pad(endParts.hour)}:${pad(endParts.minute)}`;
          } else {
            // El evento termina otro día: mostramos también el día y el mes de finalización.
            const endDayLabel = new Intl.DateTimeFormat('es-ES', { timeZone: targetTimeZone, weekday: 'long' }).format(new Date(endMs));
            const niceEndDayLabel = endDayLabel.charAt(0).toUpperCase() + endDayLabel.slice(1);
            dateText += ` – ${niceEndDayLabel} ${endParts.day} de ${MESES[endParts.month]} · ${pad(endParts.hour)}:${pad(endParts.minute)}`;
          }
        }
        modalDate.textContent = dateText;
      } else {
        modalDate.textContent = '';
      }
      modalContent.textContent = event.content || event.tooltip || '';

      // La barra de progreso SOLO se muestra cuando el modal se abre desde el banner "en directo / en curso".
      if (progressInterval){ clearInterval(progressInterval); progressInterval = null; }
      if (liveInfo){
        modalProgress.style.display = 'block';
        updateModalProgress(event, liveInfo, targetTimeZone);
        progressInterval = setInterval(() => updateModalProgress(event, liveInfo, targetTimeZone), 30000);
      } else {
        modalProgress.style.display = 'none';
      }

      if (event.link){
        modalLink.href = event.link;
        modalLink.style.display = 'inline-flex';
      } else {
        modalLink.style.display = 'none';
      }
      modalBackdrop.classList.add('active');
      modal.classList.remove('is-opening');
      void modal.offsetWidth;
      modal.classList.add('is-opening');
      modal.addEventListener('animationend', () => modal.classList.remove('is-opening'), { once: true });
    }

    function closeModal(){
      if (!modalBackdrop.classList.contains('active')) return;
      if (progressInterval){ clearInterval(progressInterval); progressInterval = null; }
      modal.classList.remove('is-opening');
      modal.classList.add('is-closing');
      const handler = (e) => {
        if (e.target !== modal) return;
        modalBackdrop.classList.remove('active');
        modal.classList.remove('is-closing');
        modal.removeEventListener('animationend', handler);
      };
      modal.addEventListener('animationend', handler, { once: true });
    }

    /* ===================== Inicio ===================== */
    function refreshAll(targetTimeZone){
      renderLiveBanner(targetTimeZone);
      renderNextRow(targetTimeZone);
      renderMiniCalendar(targetTimeZone);
      renderDestacados(targetTimeZone);
      renderFeed(targetTimeZone);
    }

    document.getElementById('prevMonth').addEventListener('click', () => {
      monthCursor = new Date(monthCursor.getFullYear(), monthCursor.getMonth() - 1, 1);
      dayFilter = null;
      renderMiniCalendar(timezoneSelector.value);
      renderDestacados(timezoneSelector.value);
      renderFeed(timezoneSelector.value);
    });
    document.getElementById('nextMonth').addEventListener('click', () => {
      monthCursor = new Date(monthCursor.getFullYear(), monthCursor.getMonth() + 1, 1);
      dayFilter = null;
      renderMiniCalendar(timezoneSelector.value);
      renderDestacados(timezoneSelector.value);
      renderFeed(timezoneSelector.value);
    });

    function initSelectors(){
      const savedTheme = localStorage.getItem('jofun2-theme') || 'oscuro';
      applyTheme(savedTheme);

      const savedTz = localStorage.getItem('jofun2-timezone') || Intl.DateTimeFormat().resolvedOptions().timeZone || 'Europe/Madrid';
      const options = rebuildTimezoneOptions(savedTz, '');
      const validTz = options.find((opt) => opt.value === savedTz) ? savedTz : 'Europe/Madrid';
      timezoneSelector.value = validTz;
      localStorage.setItem('jofun2-timezone', validTz);
      refreshAll(validTz);

      themeSeg.addEventListener('click', (e) => {
        const btn = e.target.closest('button[data-theme]');
        if (!btn) return;
        applyTheme(btn.dataset.theme);
      });

      timezoneSelector.addEventListener('change', (e) => {
        const value = e.target.value;
        localStorage.setItem('jofun2-timezone', value);
        dayFilter = null;
        refreshAll(value);
      });

      timezoneSearch.addEventListener('input', (e) => {
        const currentValue = timezoneSelector.value;
        const filtered = rebuildTimezoneOptions(currentValue, e.target.value);
        if (filtered.find((opt) => opt.value === currentValue)){
          timezoneSelector.value = currentValue;
        } else if (filtered.length > 0){
          const newValue = filtered[0].value;
          timezoneSelector.value = newValue;
          localStorage.setItem('jofun2-timezone', newValue);
          dayFilter = null;
          refreshAll(newValue);
        }
      });

      setInterval(() => refreshAll(timezoneSelector.value), 5 * 60000);
    }

    function fullPartsInTz(ms, tz){
      const fmt = new Intl.DateTimeFormat('en-US', {
        timeZone: tz, weekday:'short', year:'numeric', month:'2-digit', day:'2-digit', hour:'2-digit', minute:'2-digit', hour12:false
      });
      const parts = fmt.formatToParts(new Date(ms)).reduce((acc,{type,value}) => { acc[type]=value; return acc; }, {});
      return {
        dayIndex: WD_MAP[parts.weekday], year: Number(parts.year), month: Number(parts.month) - 1,
        day: Number(parts.day), hour: Number(parts.hour) % 24, minute: Number(parts.minute)
      };
    }

    closeModalBtn.addEventListener('click', closeModal);
    modalBackdrop.addEventListener('click', (e) => { if (e.target === modalBackdrop) closeModal(); });

    initSelectors();
  </script>
</body>
</html>
